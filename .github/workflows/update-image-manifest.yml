name: Update image carousel manifest

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/generate-image-manifest.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image manifest
        run: python3 scripts/generate-image-manifest.py

      - name: Commit updated manifest when needed
        run: |
          if git diff --quiet -- images/images.json; then
            echo "Image manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/images.json
          git commit -m "Update image carousel manifest"
          git push
